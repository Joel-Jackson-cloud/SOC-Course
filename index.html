<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIEM Cyber Security Course - Student Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Card Styling */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Login Screen */
    #login-section {
      max-width: 450px;
      margin: 0 auto;
      text-align: center;
    }

    .login-header h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      color: #ef4444;
      font-size: 14px;
      margin-top: 15px;
      display: none;
    }

    /* Course Dashboard */
    #dashboard-section {
      display: none;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .dashboard-header h2 {
      font-size: 22px;
    }

    .badge {
      background-color: #059669;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Video List Rows */
    .video-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      padding: 15px 20px;
      border-radius: 8px;
      transition: border-color 0.2s;
    }

    .video-row:hover {
      border-color: var(--accent-color);
    }

    .video-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .video-number {
      background-color: var(--card-bg);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 600;
    }

    .video-title {
      font-size: 16px;
      font-weight: 500;
    }

    .play-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .play-btn:hover {
      background-color: var(--accent-hover);
    }

    /* Video Player Modal/Overlay */
    .player-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .player-content {
      width: 100%;
      max-width: 850px;
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .player-header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    .iframe-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 ratio */
      height: 0;
      overflow: hidden;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LOGIN SECTION -->
    <div id="login-section" class="card">
      <div class="login-header">
        <h2>SIEM Cyber Security Portal</h2>
        <p>Aapna password daal kar login karein</p>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Login Karein</button>
        <p id="error-msg" class="error-msg">Galat password! Dobara koshish karein.</p>
      </form>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboard-section" class="card">
      <div class="dashboard-header">
        <div>
          <h2>SIEM Cyber Security Course</h2>
          <p style="color: var(--text-muted); font-size: 14px;">Total Modules: 18 Videos</p>
        </div>
        <span class="badge">Access Verified</span>
      </div>

      <!-- 18 Videos List -->
      <div class="video-list" id="video-list-container">
        <!-- Rows JavaScript se generate hongi -->
      </div>
    </div>

  </div>

  <!-- VIDEO PLAYER MODAL -->
  <div id="player-modal" class="player-modal">
    <div class="player-content">
      <div class="player-header">
        <h3 id="modal-video-title">Module Title</h3>
        <button class="close-btn" onclick="closePlayer()">&times;</button>
      </div>
      <div class="iframe-container">
        <iframe id="vimeo-player" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // 18 Videos Data (Yahan Vimeo Video IDs replace karein)
    const courseVideos = [
      { id: 1, title: "Module 01: Introduction to SIEM & SOC Architecture", vimeoId: "YOUR_VIMEO_ID_1" },
      { id: 2, title: "Module 02: Log Management & Event Collection", vimeoId: "YOUR_VIMEO_ID_2" },
      { id: 3, title: "Module 03: SIEM Deployment & Setup Guidelines", vimeoId: "YOUR_VIMEO_ID_3" },
      { id: 4, title: "Module 04: Understanding Syslog & Windows Event Logs", vimeoId: "YOUR_VIMEO_ID_4" },
      { id: 5, title: "Module 05: Log Parsing & Field Extraction", vimeoId: "YOUR_VIMEO_ID_5" },
      { id: 6, title: "Module 06: Rule Creation & Correlation Engine", vimeoId: "YOUR_VIMEO_ID_6" },
      { id: 7, title: "Module 07: Threat Detection & Alert Fine-Tuning", vimeoId: "YOUR_VIMEO_ID_7" },
      { id: 8, title: "Module 08: Incident Investigation Workflow", vimeoId: "YOUR_VIMEO_ID_8" },
      { id: 9, title: "Module 09: Threat Intelligence Integration", vimeoId: "YOUR_VIMEO_ID_9" },
      { id: 10, title: "Module 10: Use Case Development for Malware Detection", vimeoId: "YOUR_VIMEO_ID_10" },
      { id: 11, title: "Module 11: Detecting Brute Force & Auth Attacks", vimeoId: "YOUR_VIMEO_ID_11" },
      { id: 12, title: "Module 12: Network Security Monitoring & PCAP", vimeoId: "YOUR_VIMEO_ID_12" },
      { id: 13, title: "Module 13: Dashboard Creation & Metrics Reporting", vimeoId: "YOUR_VIMEO_ID_13" },
      { id: 14, title: "Module 14: SOAR Concepts & Automated Response", vimeoId: "YOUR_VIMEO_ID_14" },
      { id: 15, title: "Module 15: Compliance Frameworks (ISO 27001, PCI-DSS)", vimeoId: "YOUR_VIMEO_ID_15" },
      { id: 16, title: "Module 16: SIEM Tuning & Reducing False Positives", vimeoId: "YOUR_VIMEO_ID_16" },
      { id: 17, title: "Module 17: Real-World Incident Response Cases", vimeoId: "YOUR_VIMEO_ID_17" },
      { id: 18, title: "Module 18: Final Assessment & SOC Operations Review", vimeoId: "YOUR_VIMEO_ID_18" }
    ];

    // Password Check Function
    function handleLogin(event) {
      event.preventDefault();
      const inputPass = document.getElementById('password').value;
      
      // Portal Password Set
      if (inputPass === 'cyber2026') {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        loadVideoList();
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    // Load 18 Videos List in Rows
    function loadVideoList() {
      const listContainer = document.getElementById('video-list-container');
      listContainer.innerHTML = '';

      courseVideos.forEach((video) => {
        const row = document.createElement('div');
        row.className = 'video-row';
        row.innerHTML = `
          <div class="video-info">
            <div class="video-number">${video.id}</div>
            <div class="video-title">${video.title}</div>
          </div>
          <button class="play-btn" onclick="playVideo('${video.vimeoId}', '${video.title}')">
            ▶ Play
          </button>
        `;
        listContainer.appendChild(row);
      });
    }

    // Play Video in Overlay Modal
    function playVideo(vimeoId, title) {
      document.getElementById('modal-video-title').innerText = title;
      // Vimeo Private Embed Player Link
      const playerFrame = document.getElementById('vimeo-player');
      playerFrame.src = `https://player.vimeo.com/video/${vimeoId}?autoplay=1`;
      document.getElementById('player-modal').style.display = 'flex';
    }

    // Close Video Modal
    function closePlayer() {
      const playerFrame = document.getElementById('vimeo-player');
      playerFrame.src = ''; // Stop video playback
      document.getElementById('player-modal').style.display = 'none';
    }

    // Basic Anti-Tampering (Right Click Disable)
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function (e) {
      if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
        return false;
      }
    };
  </script>
</body>
</html>
